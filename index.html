<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>晨钰的生日盒子</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a handheld — game screen on top, dialogue window under it, D-pad + A at the bottom; in landscape the pad splits to the sides */
:root {
  --shell: #2a2433;
  --shell-hi: #3a3246;
  --win: #fff8ea;
  --win-ink: #3a2e25;
  --edge: #2b2230;
  --gold: #f6b94a;
  --text: #fbf3e4;
  --muted: #b9adc4;
  --btn: #e8607a;
  --tag: #f2a7b0;
  --cream: #fdf3dc;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--shell); color: var(--text); font-family: var(--body); overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none; }
/* the whole console is laid out at a fixed size and scaled as one piece to fit the window (see fit()) */
#app { position: absolute; left: 50%; top: 50%; width: 420px; height: 728px; transform: translate(-50%, -50%) scale(var(--k, 1)); display: flex; flex-direction: column; gap: 10px; padding: 12px; box-sizing: border-box; background: var(--shell); }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- screen ---------- */
#screen { position: relative; width: 100%; aspect-ratio: 8 / 5; margin: 0 auto; flex: none; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 3px var(--edge), 0 0 0 6px var(--shell-hi); background: #141a2e; }
#game { width: 100%; height: 100%; display: block; touch-action: none; }
#game.blur { filter: blur(7px) brightness(.9); }
.chip { font-size: 12px; background: var(--win); color: var(--win-ink); border: 2px solid var(--edge); border-radius: 999px; padding: 2px 10px; z-index: 9; }
#hud { font-family: var(--display); font-size: 15px; padding: 1px 10px 1px 8px; display: flex; align-items: center; gap: 6px; pointer-events: none; }
#hud i { display: inline-block; width: 5px; height: 13px; border-radius: 2px; background: linear-gradient(#f6b94a 0 30%, #f2a7b0 30% 100%); }
/* status bar above the game screen: candles on the left, volume + fullscreen on the right */
#status { position: relative; flex: none; height: 28px; display: flex; align-items: center; z-index: 12; }
#tools { margin-left: auto; display: flex; gap: 6px; }
#tools .chip { position: static; }
#volpanel { position: absolute; top: 34px; right: 0; z-index: 12; background: var(--win); color: var(--win-ink); border: 2px solid var(--edge); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
#vol { width: 150px; height: 30px; accent-color: var(--btn); touch-action: none; }
#volpanel .vb { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--edge); background: var(--btn); color: #fff; font-size: 18px; line-height: 1; padding: 0; touch-action: manipulation; }
#volpanel .vb:active { transform: translateY(1px); }
#volv { min-width: 2.2em; text-align: right; }
#caption { position: absolute; left: 0; right: 0; top: 7%; text-align: center; color: var(--text); text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; line-height: 1.6; padding-inline: 12px; }
#caption .big { font-family: var(--display); font-size: 28px; color: #ffe2a0; }
#caption .small { font-size: 12px; color: #d8d2e8; letter-spacing: .1em; }
#blink { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.lid { position: absolute; left: -10%; right: -10%; height: 51%; background: #07060c; transition: transform .45s ease-in-out; }
.lid.top { top: 0; border-radius: 0 0 50% 50% / 0 0 30% 30%; }
.lid.bot { bottom: 0; border-radius: 50% 50% 0 0 / 30% 30% 0 0; }
#whisper { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; color: var(--muted); font-size: 14px; z-index: 2; padding-inline: 20px; transition: opacity .4s; white-space: pre-line; }
#cg { position: absolute; inset: 0; z-index: 4; opacity: 0; transition: opacity .8s; pointer-events: none; background: #000; }
#cg img { width: 100%; height: 100%; object-fit: cover; display: block; }
#fade, #flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 6; }
#fade { background: #000; } #flash { background: #fff; transition-duration: 1s; }
.on { opacity: 1 !important; }
#lyric { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; font-family: var(--display); font-size: 28px; color: #fff; text-shadow: 0 2px 0 var(--edge), 0 0 12px rgba(0,0,0,.5); pointer-events: none; z-index: 4; }
#wish { position: absolute; inset: 0; z-index: 7; background: rgba(12,10,22,.86); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-inline: 16px; text-align: center; }
#wish p { margin: 0; font-family: var(--display); color: #ffe2a0; font-size: 20px; }
#wish label { font-size: 13px; color: var(--muted); }
#wish-input { width: 100%; max-width: 320px; background: #1d1830; color: var(--text); border: 2px solid var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 16px; resize: none; user-select: text; -webkit-user-select: text; box-sizing: border-box; }
#wish-done { font-family: var(--display); background: var(--gold); color: var(--edge); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 20px; font-size: 16px; }

/* ---------- dialogue window ---------- */
#dlg { position: relative; flex: none; min-height: 150px; margin-top: 10px; background: var(--win); color: var(--win-ink); border: 3px solid var(--edge); border-radius: 14px; box-shadow: 0 5px 0 var(--edge); padding: 14px 14px 12px; display: flex; gap: 12px; cursor: pointer; box-sizing: border-box; }
#dlg-name { position: absolute; top: -15px; left: 14px; font-family: var(--display); font-size: 15px; background: var(--tag); color: var(--edge); border: 2px solid var(--edge); border-radius: 999px; padding: 0 12px; }
#dlg-name.unknown { background: #d8d2e8; }
#dlg-name.pop { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.25); } }
#face { flex: none; width: 60px; height: 60px; border-radius: 10px; background: #f3e2c4; border: 2px solid var(--edge); }
#dlg-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
#dlg-text { font-size: 16px; line-height: 1.7; white-space: pre-line; }
#dlg-text.narr { color: #6d5f53; }
#dlg-text.idle { color: #8a7c70; font-size: 14px; }
#dlg-more { position: absolute; right: 12px; bottom: 6px; color: #c0504a; font-size: 12px; opacity: 0; }
#dlg.ready #dlg-more { opacity: 1; animation: nudge .8s infinite; }
@keyframes nudge { 50% { transform: translateY(3px); } }
#choices { display: flex; flex-direction: column; gap: 4px; }
#choices button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 6px 8px 6px 22px; position: relative; font-size: 15px; color: var(--win-ink); }
#choices button.sel { background: #f6e3c2; }
#choices button.sel::before { content: "▶"; position: absolute; left: 6px; font-size: 10px; top: 11px; color: #c0504a; }
#holdbar { height: 12px; border: 2px solid var(--edge); border-radius: 999px; background: #f3e2c4; overflow: hidden; }
#holdbar div { height: 100%; width: 0; background: var(--btn); }

/* ---------- controls ---------- */
#pad { flex: 1; min-height: 110px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 6px; }
#dpad { position: relative; width: 132px; height: 132px; flex: none; }
#dpad button { position: absolute; width: 44px; height: 44px; background: var(--shell-hi); border: 0; box-shadow: 0 4px 0 #151119; color: var(--muted); font-size: 16px; touch-action: none; }
#dpad button.held { transform: translateY(3px); box-shadow: 0 1px 0 #151119; color: var(--gold); }
#dpad .u { left: 44px; top: 0; border-radius: 8px 8px 0 0; }
#dpad .d { left: 44px; top: 88px; border-radius: 0 0 8px 8px; }
#dpad .l { left: 0; top: 44px; border-radius: 8px 0 0 8px; }
#dpad .r { left: 88px; top: 44px; border-radius: 0 8px 8px 0; }
#dpad .c { left: 44px; top: 44px; width: 44px; height: 44px; position: absolute; background: var(--shell-hi); }
#abtn { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--btn); box-shadow: 0 6px 0 #9c3049; font-family: var(--display); font-size: 28px; color: #fff; touch-action: none; flex: none; }
#abtn.held { transform: translateY(4px); box-shadow: 0 2px 0 #9c3049; }
.keys { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; min-width: 0; }

/* wide windows (landscape phones, desktop, fullscreen): big game screen in the middle, a compact dialogue window right under it (never over the picture), big pad and A on the sides */
#app.land { width: 1280px; height: 618px; padding: 14px 20px; display: grid; grid-template-columns: 290px 640px 290px; grid-template-rows: 30px 400px 1fr; grid-template-areas: "dpad status abtn" "dpad screen abtn" "dpad dlg abtn"; gap: 8px 0; }
#app.land #status { grid-area: status; }
#app.land #screen { grid-area: screen; width: 640px; height: 400px; }
#app.land #dlg { grid-area: dlg; margin: 18px 0 0; min-height: 0; padding: 10px 14px 8px; gap: 10px; }
#app.land #dlg-text { font-size: 17px; line-height: 1.5; }
#app.land #dlg-text.idle { font-size: 14px; line-height: 1.5; }
#app.land #dlg-body { gap: 2px; }
#app.land #choices { gap: 0; }
#app.land #choices button { font-size: 16px; padding-block: 2px; }
#app.land #choices button.sel::before { top: 7px; }
#app.land #face { width: 52px; height: 52px; }
#app.land #dlg-name { top: -13px; font-size: 14px; }
#app.land #pad { display: contents; }
#app.land #dpad { grid-area: dpad; align-self: center; justify-self: start; margin-left: 40px; transform: scale(1.5); }
#app.land #abtn { grid-area: abtn; align-self: center; justify-self: end; margin-right: 30px; width: 124px; height: 124px; font-size: 46px; box-shadow: 0 8px 0 #9c3049; }
#app.land #abtn.held { box-shadow: 0 3px 0 #9c3049; }
#app.land .keys { display: none; }
#app.land #open { gap: 6px; }
#app.land #giftbox { width: 230px; margin-top: 56px; }
/* ---------- opening: the gift box ---------- */
#open { position: absolute; inset: 0; z-index: 30; background: radial-gradient(circle at 50% 45%, #fff6e2, #f6dcc0 70%); color: var(--win-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-inline: 16px; text-align: center; transition: opacity .7s; }
#open .sub { font-size: 14px; color: #8a6b4f; }
#giftbox { width: 280px; margin-top: 64px; background: none; border: 0; padding: 0; }
#giftbox svg { width: 100%; overflow: visible; display: block; }
#giftbox.shake { animation: shake .5s; }
@keyframes shake { 20% { transform: rotate(-6deg); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
#lidg { transition: transform .8s cubic-bezier(.3,1.6,.5,1); transform-origin: 140px 100px; }
#giftbox.open #lidg { transform: translate(136px, 58px) rotate(78deg) scale(.7); }
#console { transform: translateY(70px) scale(.6); opacity: 0; transition: transform .9s cubic-bezier(.3,1.5,.5,1) .25s, opacity .3s .25s; transform-origin: 140px 150px; }
#giftbox.open #console { transform: translateY(-62px) scale(1); opacity: 1; }
#glow { opacity: 0; transition: opacity .6s; }
#giftbox.open #glow { opacity: 1; }
#open .hint { font-size: 15px; color: #c0504a; min-height: 1.4em; }
#play { font-family: var(--display); font-size: 20px; background: var(--btn); color: #fff; border: 3px solid var(--edge); border-radius: 999px; padding: 6px 30px; box-shadow: 0 5px 0 var(--edge); }
#play:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
/* ---------- ending letter ---------- */
#end { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-inline: 16px; background: rgba(20,16,30,.82); }
.letter { background: var(--win); color: var(--win-ink); border: 3px solid var(--edge); border-radius: 14px; box-shadow: 0 6px 0 var(--edge); padding: 16px 18px; max-width: 380px; font-size: 15px; line-height: 1.85; max-height: 78%; overflow: auto; box-sizing: border-box; }
.letter h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 6px; color: #c0504a; }
.letter p { margin: 0 0 6px; }
.letter .sign { text-align: right; color: #8a6b4f; font-size: 13px; }
#again { font-family: var(--display); background: var(--win); color: var(--edge); border: 2px solid var(--edge); border-radius: 999px; padding: 4px 16px; font-size: 15px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>

<div id="app">
  <div id="status">
      <div class="chip" id="hud" hidden><i></i><span id="hud-n">0 / 7</span></div>
      <div id="tools">
        <button class="chip" id="volbtn" type="button" aria-expanded="false">♪ 音量</button>
        <button class="chip" id="fsbtn" type="button">⛶ 全屏</button>
      </div>
      <div id="volpanel" hidden>
        <label for="vol">音乐</label>
        <button class="vb" id="voldn" type="button" aria-label="小声一点">－</button>
        <input id="vol" type="range" min="0" max="100" step="5" value="50">
        <button class="vb" id="volup" type="button" aria-label="大声一点">＋</button>
        <span id="volv">50</span>
      </div>
  </div>
  <div id="screen">
    <canvas id="game"></canvas>
    <div id="caption"></div>
    <div id="lyric" aria-live="polite"></div>
    <div id="cg"><img id="cgimg" alt=""></div>
    <div id="blink" hidden>
      <div class="lid top" id="lid-top"></div>
      <div class="lid bot" id="lid-bot"></div>
      <div id="whisper"></div>
    </div>
    <div id="wish" hidden>
      <p>闭上眼睛，许个愿吧</p>
      <label for="wish-input">写下来也可以，只在心里想也可以。没有人会看到。</label>
      <textarea id="wish-input" rows="3" placeholder="我希望……"></textarea>
      <button id="wish-done" type="button">许好啦</button>
    </div>
    <div id="fade"></div>
    <div id="flash"></div>
  </div>

  <div id="dlg" role="button" tabindex="0" aria-live="polite">
    <div id="dlg-name" hidden></div>
    <canvas id="face" width="240" height="240" hidden></canvas>
    <div id="dlg-body">
      <div id="dlg-text">加载中……</div>
      <div id="choices" hidden></div>
      <div id="holdbar" hidden><div></div></div>
    </div>
    <div id="dlg-more">▼</div>
  </div>

  <div id="pad">
    <div id="dpad" aria-label="方向键">
      <button class="u" data-dir="up" type="button" aria-label="上">▲</button>
      <button class="l" data-dir="left" type="button" aria-label="左">◀</button>
      <span class="c"></span>
      <button class="r" data-dir="right" type="button" aria-label="右">▶</button>
      <button class="d" data-dir="down" type="button" aria-label="下">▼</button>
    </div>
    <div class="keys">点地面也能走过去<br>方向键 / WASD 走路<br>空格 / Enter = A</div>
    <button id="abtn" type="button" aria-label="A 键">A</button>
  </div>

  <div id="end" hidden>
    <div class="letter">
      <h2>晨钰，生日快乐！</h2>
      <p>今天也辛苦啦。</p>
      <p>你趴在电脑前睡着的那一小会儿，我们都来过了。蛋糕是真的，蜡烛是真的，大家唱的歌也是真的。</p>
      <p>不管你在地球的哪一边，那边是春天还是秋天，累了就闭上眼睛，我们就在。</p>
      <p>新的一岁，也要被好好爱着。</p>
      <div class="sign">花花 · 媛媛 · 默默 · 小猫 · None · 蟹黄堡 · 茶茶<br>10 月 23 日</div>
    </div>
    <button id="again" type="button">再玩一次</button>
  </div>

  <div id="open">
    <div class="sub">10 月 23 日 · 寄往阿根廷</div>
    <button id="giftbox" type="button" aria-label="打开礼物盒">
      <svg viewBox="0 0 280 260">
        <g id="glow"><circle cx="140" cy="110" r="90" fill="#fff4c8" opacity=".75"/><circle cx="140" cy="110" r="60" fill="#fffbe6"/></g>
        <g id="console">
          <!-- a cream retro handheld -->
          <path d="M98 26 h84 a10 10 0 0 1 10 10 v120 a32 32 0 0 1 -32 32 h-62 a10 10 0 0 1 -10 -10 v-142 a10 10 0 0 1 10 -10z" fill="#efe8d8" stroke="#2b2230" stroke-width="5"/>
          <path d="M100 38 h80 a6 6 0 0 1 6 6 v50 a14 14 0 0 1 -14 14 h-72 a6 6 0 0 1 -6 -6 v-58 a6 6 0 0 1 6 -6z" fill="#6c6f88" stroke="#2b2230" stroke-width="3"/>
          <circle cx="104" cy="66" r="2.6" fill="#ff6b6b"/>
          <rect x="112" y="46" width="62" height="52" rx="3" fill="#b9cc95" stroke="#2b2230" stroke-width="2"/>
          <g fill="#3f5232">
            <rect x="133" y="54" width="5" height="5"/><rect x="148" y="54" width="5" height="5"/><rect x="128" y="59" width="15" height="5"/><rect x="143" y="59" width="15" height="5"/>
            <rect x="128" y="64" width="30" height="5"/><rect x="133" y="69" width="20" height="5"/><rect x="138" y="74" width="10" height="5"/>
          </g>
          <text x="143" y="93" text-anchor="middle" font-family="ZCOOL KuaiLe, sans-serif" font-size="11" fill="#3f5232">晨钰</text>
          <text x="110" y="118" font-family="ZCOOL KuaiLe, sans-serif" font-size="8" fill="#6c6f88" font-style="italic">Pocket Dream</text>
          <path d="M104 136 h9 v-9 h9 v9 h9 v9 h-9 v9 h-9 v-9 h-9z" fill="#2b2230"/>
          <circle cx="176" cy="132" r="7.5" fill="#b4366c" stroke="#2b2230" stroke-width="2.5"/>
          <circle cx="160" cy="141" r="7.5" fill="#b4366c" stroke="#2b2230" stroke-width="2.5"/>
          <rect x="124" y="164" width="14" height="5" rx="2.5" fill="#9b98a8" transform="rotate(-25 131 166)"/>
          <rect x="143" y="164" width="14" height="5" rx="2.5" fill="#9b98a8" transform="rotate(-25 150 166)"/>
          <g stroke="#9b98a8" stroke-width="2.5" stroke-linecap="round"><path d="M166 176 l12 -12"/><path d="M171 179 l12 -12"/><path d="M161 173 l12 -12"/></g>
        </g>
        <rect x="52" y="120" width="176" height="124" rx="12" fill="#f7b2a2" stroke="#2b2230" stroke-width="5"/>
        <rect x="128" y="120" width="24" height="124" fill="#fff4dc" stroke="#2b2230" stroke-width="4"/>
        <circle cx="86" cy="160" r="5" fill="#fff" opacity=".6"/><circle cx="196" cy="200" r="5" fill="#fff" opacity=".6"/><circle cx="92" cy="220" r="5" fill="#fff" opacity=".6"/><circle cx="190" cy="150" r="5" fill="#fff" opacity=".6"/>

          <rect x="40" y="94" width="200" height="34" rx="10" fill="#ee9483" stroke="#2b2230" stroke-width="5"/>
          <rect x="128" y="94" width="24" height="34" fill="#fff4dc" stroke="#2b2230" stroke-width="4"/>
          <path d="M140 94 C112 50 72 60 88 86 C96 98 120 96 140 94Z" fill="#fff4dc" stroke="#2b2230" stroke-width="4"/>
          <path d="M140 94 C168 50 208 60 192 86 C184 98 160 96 140 94Z" fill="#fff4dc" stroke="#2b2230" stroke-width="4"/>
          <circle cx="140" cy="92" r="10" fill="#f6b94a" stroke="#2b2230" stroke-width="4"/>
        </g>
      </svg>
    </button>
    <div class="hint" id="openhint">点一下，拆开盒子</div>
    <button id="play" type="button" hidden>开始游戏</button>
  </div>
  <audio id="bgm" src="assets/bgm.mp3" loop preload="auto"></audio>
</div>

<script>
/* ======================================================
   想改祝福或台词，改这里就好
   句首可以加表情：[平静] [开心] [大笑] [生气] [哭泣] [惊讶] [脸红] [困倦] [撒娇] [爱心眼]
   ====================================================== */
const WISHES = {
  huahua:   ["晨钰，生日快乐！", "愿你走到哪里，都有人给你留一盏灯、一个位置。累了就回来，我们一直在。"],
  yuanyuan: ["[脸红]祝你……每天都有好吃的，还有晒得到太阳的窗台。", "[撒娇]（小小声）还有，要开心哦。"],
  momo:     ["[平静]……生日快乐。", "想做的事，慢慢做就好。不急，我们等你。"],

async function interact(forced) {
  const near = forced ? [forced, 0] : Object.values(E).filter(e => e !== me && e.visible && e.map === map)
    .map(e => [e, Math.hypot(e.x - me.x, e.y - me.y)]).filter(([, d]) => d < 85).sort((a, b) => a[1] - b[1])[0];
  let what = near ? near[0] === E.huahua ? "huahua" : Object.keys(E).find(k => E[k] === near[0]) : null;
  if (!what && map === "room" && !S.has.fish && Math.hypot(me.x - 520, me.y - 596) < 60) what = "fish";
  if (!what && map === "garden" && S.quest.flowers) {
    const i = FLOWERS.findIndex(([x, y], i) => !S.picked[i] && Math.hypot(me.x - x, me.y - y) < 60);
    if (i >= 0) what = "flower" + i;
  }
  const sp = Object.entries(MAPS[map].spots).find(([, r]) => inRect(me.x, me.y, r, 30));
  if (!forced && S.party && what === "nono" && sp) what = sp[0];
  if (!what && sp) what = sp[0];
  if (!what) return;
  busy = true; held.length = 0; me.moving = false; target = null;
  for (const e of Object.values(E)) if (e.amb && e.amb.state === "go") { e.moving = false; e.amb = { state: "rest", until: clock + 3000 }; }
  if (near) face(me, near[0]);
  try { await (what.startsWith("flower") ? pickFlower(+what.slice(6)) : what.startsWith("flora") ? flora(+what.slice(5)) : S.party && PARTY[what] ? PARTY[what]() : ACT[what]?.()); }
  finally { if (scene === "map") { busy = false; idle(hint()); } }
}

// paper confetti popping out of the box when it opens
function burstOpen() {
  if (RM) return;
  const o = $("#open"), r = $("#giftbox").getBoundingClientRect(), orr = o.getBoundingClientRect(), k = orr.width / o.offsetWidth;
  const cx = (r.left + r.width / 2 - orr.left) / k, cy = (r.top + r.height * .58 - orr.top) / k;
  const cols = ["#f2a7b0", "#f6c55a", "#a8cfe8", "#bfe3d0", "#cdbdf0"];
  for (let i = 0; i < 36; i++) {
    const d = document.createElement("i"), a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = 120 + Math.random() * 160;
    d.style.cssText = `position:absolute;left:${cx}px;top:${cy}px;width:8px;height:5px;border-radius:2px;background:${cols[i % 5]};pointer-events:none`;
    o.append(d);
    d.animate([{ transform: "translate(0,0) rotate(0)" }, { transform: `translate(${Math.cos(a) * v}px, ${Math.sin(a) * v + 220}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }],
      { duration: 1400 + Math.random() * 700, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => d.remove();
  }
}

  const hv = Math.hypot(hh.x - (e.hlx ?? hh.x), hh.y - (e.hly ?? hh.y)) / Math.max(dt, 1); e.hlx = hh.x; e.hly = hh.y;

/* 生日快乐歌：唱歌时先停背景音乐，用八音盒的音色弹一遍，歌词跟着每一句出来 */
const HB = [ // [note, beats] per line
  [["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2]],
  [["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2]],
  [["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2]],
  [["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 3]],
];
const HB_BASS = [["C3", "G2"], ["G2", "C3"], ["C3", "F2"], ["C3", "G2", "C3"]];
function hz(n) { const i = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[n[0]]; return 440 * Math.pow(2, (i + (+n[1] - 4) * 12) / 12); }
function musicBox(f, t, dur, v = .09) {
  const ctx = actx; if (!ctx) return;
  [[1, "sine", v], [2, "sine", v * .25], [3, "triangle", v * .08]].forEach(([m, type, gv]) => {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.value = f * m;
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(gv * (+vol.value / 60 + .2), t + .01);
    gn.gain.exponentialRampToValueAtTime(.0005, t + Math.max(.6, dur * 1.4));
    o.connect(gn).connect(ctx.destination); o.start(t); o.stop(t + dur * 1.5 + .1);
  });
}
async function sing() {
  const lines = ["祝你生日快乐", "祝你生日快乐", "祝晨钰生日快乐", "祝你生日快乐～"];
  Object.values(E).forEach(e => e.dance = true);
  idle("♪");
  bgmHold = true; bgm.pause();
  audio(); const beat = .52;
  let t = actx ? actx.currentTime + .3 : 0;
  for (let li = 0; li < HB.length; li++) {
    const lineStart = t;
    HB[li].forEach(([n, b], k) => { musicBox(hz(n), t, b * beat); if (k === 0 || k === 2 || k === 5) { const bn = HB_BASS[li][k === 0 ? 0 : k === 2 ? 0 : 1] || "C3"; musicBox(hz(bn), t, 1.4, .05); } t += b * beat; });
    t += beat * .5;
    const wait = actx ? (lineStart - actx.currentTime) * 1000 : 0;
    if (wait > 0) await sleep(wait);
    $("#lyric").textContent = "♪ " + lines[li];
  }
  await sleep(actx ? (t - actx.currentTime) * 1000 + 300 : 3000);
  $("#lyric").textContent = "";
  Object.values(E).forEach(e => e.dance = false);
  bgmHold = false; audio();
}
